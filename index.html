<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>IG Downloader — Test</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="wrap">
    <h1>IG Downloader — Test</h1>

    <p class="hint">Tempel link posting / reel / foto publik Instagram lalu tekan <strong>Cari media</strong>.</p>

    <div class="box">
      <input id="urlInput" type="text" placeholder="https://www.instagram.com/..." />
      <div class="controls">
        <button id="btnFetch" class="primary">Cari media</button>
        <button id="btnClear" class="ghost">Hapus</button>
      </div>
      <div id="msg" class="msg info">Jika error, lihat cuplikan response di bawah untuk debug.</div>
    </div>

    <section id="results" class="results" aria-live="polite"></section>
  </main>

  <script src="/script.js"></script>
</body>
</html>
