<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>IG Downloader - Test</title>
  <style>
    body{font-family:system-ui,Segoe UI,Roboto; background:#0b0f16;color:#e6eef8; padding:28px}
    .card{max-width:720px;margin:24px auto;padding:20px;border-radius:12px;background:linear-gradient(180deg,#0f1720, #0b1015); box-shadow: 0 6px 30px rgba(0,0,0,.6)}
    input[type=text]{width:100%;padding:12px;border-radius:8px;border:1px solid rgba(255,255,255,.06);background:#071018;color:#fff}
    button{padding:10px 14px;border-radius:8px;border:0;background:linear-gradient(90deg,#4f9fff,#7c6bff);color:#fff;cursor:pointer}
    .muted{color:#9fb0c8;font-size:14px;margin-top:10px}
    .error{color:#ff6b6b;margin-top:12px}
    pre{background:#051018;padding:12px;border-radius:8px;color:#bfe0ff;overflow:auto}
  </style>
</head>
<body>
  <div class="card">
    <h2>IG Downloader — Test</h2>
    <p class="muted">Tempel link posting/reel/foto publik Instagram lalu tekan "Cari media".</p>

    <div style="margin-top:12px">
      <input id="urlInput" type="text" placeholder="https://www.instagram.com/reel/..." value="" />
    </div>

    <div style="margin-top:12px;display:flex;gap:8px">
      <button id="btnFetch">Cari media</button>
      <button id="btnClear" style="background:#222;color:#fff">Hapus</button>
    </div>

    <div id="status" class="muted" style="margin-top:12px"></div>
    <div id="error" class="error"></div>

    <div id="result" style="margin-top:16px"></div>
  </div>

<script>
  const btn = document.getElementById('btnFetch');
  const clearBtn = document.getElementById('btnClear');
  const urlInput = document.getElementById('urlInput');
  const statusEl = document.getElementById('status');
  const errorEl = document.getElementById('error');
  const resultEl = document.getElementById('result');

  clearBtn.onclick = () => {
    urlInput.value = '';
    statusEl.textContent = '';
    errorEl.textContent = '';
    resultEl.innerHTML = '';
  };

  btn.onclick = async () => {
    errorEl.textContent = '';
    statusEl.textContent = 'Loading...';
    resultEl.innerHTML = '';
    const url = urlInput.value.trim();
    if (!url) { errorEl.textContent = "Masukkan URL Instagram"; statusEl.textContent=''; return; }

    try {
      const res = await fetch('/api/extract', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url })
      });

      const text = await res.text();

      // try parse JSON; if not, show snippet for debug
      try {
        const data = JSON.parse(text);
        statusEl.textContent = 'Sukses — lihat hasil di bawah';
        resultEl.innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
      } catch (e) {
        // non-json response (maybe HTML snippet). show first chunk to debug.
        errorEl.textContent = 'Network error: Upstream returned non-JSON (lihat debug di bawah)';
        resultEl.innerHTML = '<pre>' + escapeHtml(text.slice(0, 2000)) + '</pre>';
        statusEl.textContent = '';
      }
    } catch (err) {
      errorEl.textContent = 'Request failed: ' + err.message;
      statusEl.textContent = '';
    }
  };

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, (m) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }
</script>
</body>
</html>
