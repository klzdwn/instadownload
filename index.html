<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>IG Downloader — Test</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    /* minimal fallback styles supaya ga rusak bila styles.css belum ada */
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; background:#0b1220; color:#e6edf3; margin:0; }
    .wrap { max-width:840px; margin:36px auto; padding:16px; }
    .card { background: rgba(255,255,255,0.03); padding:18px; border-radius:12px; }
    input[type="url"] { width:100%; padding:12px 14px; border-radius:8px; border:1px solid rgba(255,255,255,0.06); background:transparent; color:inherit; box-sizing:border-box; }
    .buttons { margin-top:12px; display:flex; gap:8px; }
    button { padding:8px 12px; border-radius:8px; border:none; cursor:pointer; }
    #status { margin-top:10px; color:#9ae6b4; }
    .results { margin-top:14px; }
    pre.debug { background:#111; color:#f6f8fa; padding:12px; border-radius:8px; overflow:auto; }
    .note { margin-top:18px; color:#94a3b8; font-size:14px; }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>IG Downloader — Test</h1>

    <p class="subtitle">Tempel link posting / reel / foto publik Instagram lalu tekan <strong>Cari media</strong>.</p>

    <div class="card" role="region" aria-label="IG downloader card">
      <!-- type=url membantu browser & mobile validate -->
      <input id="url" type="url" placeholder="https://www.instagram.com/reel/..." aria-label="Instagram URL" />
      <div class="buttons" style="margin-top:8px;">
        <button id="btnFetch" type="button">Cari media</button>
        <button id="btnClear" type="button">Hapus</button>
      </div>

      <div id="status" class="status" aria-live="polite" role="status"></div>
      <div id="results" class="results" aria-live="polite"></div>
      <pre id="debug" class="debug" style="display:none"></pre>
    </div>

    <p class="note">Pastikan backend <code>/api/extract</code> terpasang & env RapidAPI benar.</p>
  </main>

  <!-- pastikan script.js ada di root dan terbaru -->
  <script src="/script.js"></script>
</body>
</html>
