<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>IG Downloader - test</title>
<style>
  body{font-family:system-ui;background:#0b0c12;color:#fff;padding:24px}
  .card{max-width:720px;margin:0 auto;background:#111216;padding:18px;border-radius:12px}
  input{width:100%;padding:10px;border-radius:8px;border:1px solid #222;background:#0d0f14;color:#fff}
  button{margin-top:8px;padding:10px 14px;border-radius:8px;border:0;background:#5b8cff;color:#fff}
  .status{margin-top:12px;color:#ff9}
  .preview{margin-top:12px}
</style>
</head>
<body>
  <div class="card">
    <h2>IG Downloader - Test</h2>
    <input id="link" placeholder="https://www.instagram.com/reel/..." />
    <button id="go">Cari media</button>
    <div id="status" class="status"></div>
    <div id="preview" class="preview"></div>
  </div>

<script>
  document.getElementById('go').addEventListener('click', async ()=>{
    const url = document.getElementById('link').value.trim();
    const status = document.getElementById('status');
    const preview = document.getElementById('preview');
    preview.innerHTML = ''; status.textContent = 'Mencari...';
    try {
      const r = await fetch('/api/extract', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ url })
      });
      const j = await r.json();
      if(!r.ok) {
        status.style.color = '#ff8a8a';
        status.textContent = j.error || 'Error';
        preview.innerHTML = '<pre style="color:#ddd;max-height:200px;overflow:auto">'+JSON.stringify(j, null, 2)+'</pre>';
        return;
      }
      status.style.color = '#a8ffa8';
      status.textContent = 'Media ditemukan';
      if(j.media_url) {
        const m = j.media_url;
        if(/\.(mp4|webm|m3u8)/i.test(m)) {
          preview.innerHTML = `<video controls src="${m}" style="max-width:100%"></video><br/><a href="${m}" download>Download</a>`;
        } else {
          preview.innerHTML = `<img src="${m}" style="max-width:100%"/><br/><a href="${m}" download>Download</a>`;
        }
      } else {
        preview.innerHTML = '<pre style="color:#ddd">'+JSON.stringify(j, null, 2)+'</pre>';
      }
    } catch (e) {
      status.style.color = '#ff8a8a';
      status.textContent = 'Network error: ' + e.message;
    }
  });
</script>
</body>
</html>
