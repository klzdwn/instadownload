<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>IG Downloader - Test</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="card">
    <h1>IG Downloader - Test</h1>
    <input id="url" placeholder="https://www.instagram.com/reel/..." />
    <div class="controls">
      <button id="go">Cari media</button>
    </div>
    <div id="msg" class="msg"></div>
    <pre id="out" class="out"></pre>
  </main>

  <script>
    const go = document.getElementById('go');
    const urlIn = document.getElementById('url');
    const msg = document.getElementById('msg');
    const out = document.getElementById('out');

    function showMsg(t, isErr = true){
      msg.textContent = t;
      msg.style.color = isErr ? "#ff6b6b" : "#8be78b";
    }

    go.addEventListener('click', async () => {
      const url = urlIn.value.trim();
      out.textContent = "";
      showMsg("");
      if (!url) return showMsg("Masukkan link Instagram dulu.");

      showMsg("Memproses...", false);

      try {
        const resp = await fetch('/api/extract', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });

        const j = await resp.json();

        if (!resp.ok) {
          showMsg(`Gagal: ${j.error || resp.status}`, true);
          out.textContent = JSON.stringify(j, null, 2);
          return;
        }

        // success
        showMsg("Sukses — lihat hasil di bawah", false);
        out.textContent = JSON.stringify(j, null, 2);

      } catch (err) {
        showMsg("Network error: " + err.message);
      }
    });
  </script>
</body>
</html>
