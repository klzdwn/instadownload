<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>IG Downloader — Mobile</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="overlay"></div>

  <div class="container">
    <header>
      <div class="logo">IG</div>
      <div>
        <h1>IG Downloader (Beta)</h1>
        <p class="lead">Tempel link posting / reel / foto publik Instagram lalu tekan <strong>Download</strong>.</p>
      </div>
    </header>

    <main class="card">
      <form id="form" onsubmit="return false;">
        <div class="input-wrap">
          <input id="url" class="url" type="url" placeholder="https://www.instagram.com/p/SHORTCODE/ atau /reel/..." required />
        </div>

        <div class="btn-group">
          <button id="btnDownload" class="btn btn-download">Download</button>
          <button id="btnClear" class="btn btn-clear" type="button">Hapus</button>
        </div>
      </form>

      <div class="helper">Jika error, coba re-load atau paste ulang link.</div>

      <div id="status" class="result" aria-live="polite"></div>
    </main>

    <section class="section">
      <h3>Tentang IG Downloader</h3>
      <p class="helper">Website ringan untuk download media IG publik. Mobile-friendly.</p>
    </section>
  </div>

  <a class="fab" href="#" id="fab" aria-label="Bantuan">
    <img src="https://i.imgur.com/0y0y0y0.png" alt="help">
  </a>

  <script src="script.js"></script>
</body>
</html>
