<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>IG Downloader - Minimal</title>
  <style>
    body{font-family:Inter,system-ui,Arial;margin:28px;background:#0f1724;color:#e6eef8}
    .card{max-width:820px;margin:0 auto;background:#0b1220;padding:20px;border-radius:12px}
    input{width:100%;padding:12px;border-radius:8px;border:1px solid rgba(255,255,255,0.06);margin-bottom:10px;background:#0a1117;color:#fff}
    button{padding:10px 14px;border-radius:8px;border:none;background:#7c3aed;color:white;cursor:pointer}
    .row{display:flex;gap:8px}
    .msg{padding:12px;border-radius:8px;margin-top:12px}
    .msg.err{background:#ff4d4f;color:white}
    .msg.ok{background:#2f855a;color:white}
    .media{display:flex;gap:12px;align-items:center;margin-top:12px;background:rgba(255,255,255,0.02);padding:12px;border-radius:10px}
    .thumb{width:120px;height:90px;background:#061018;border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center}
    a.btn{padding:8px 12px;border-radius:8px;background:#7c3aed;color:#fff;text-decoration:none}
  </style>
</head>
<body>
  <div class="card">
    <h1>Instagram Downloader (minimal)</h1>
    <p>Paste Instagram post / reel / photo public → tekan Download</p>

    <input id="igUrl" placeholder="https://www.instagram.com/reel/..." type="text" />
    <div class="row">
      <button id="btnFetch">Download</button>
      <button id="btnClear">Hapus</button>
    </div>

    <div id="resultArea"></div>
  </div>

  <script src="./script.js"></script>
</body>
</html>
