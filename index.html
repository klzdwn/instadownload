<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>IG Downloader — Test</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="wrap">
    <h1>IG Downloader — Test</h1>

    <p class="subtitle">Tempel link posting / reel / foto publik Instagram lalu tekan <strong>Cari media</strong>.</p>

    <div class="card">
      <input id="url" placeholder="https://www.instagram.com/reel/..." />
      <div class="buttons">
        <button id="btnFetch">Cari media</button>
        <button id="btnClear">Hapus</button>
      </div>

      <div id="status" class="status"></div>
      <div id="results" class="results" aria-live="polite"></div>
      <pre id="debug" class="debug" style="display:none"></pre>
    </div>

    <p class="note">Pastikan backend <code>/api/extract</code> terpasang & env RapidAPI benar.</p>
  </main>

  <script src="/script.js"></script>
</body>
</html>
